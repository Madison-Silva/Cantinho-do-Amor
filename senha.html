<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acesso</title>
  <link rel="stylesheet" href="senha.css">
</head>
<body>

<section class="lock-screen">
  <h1>💙 Área especial</h1>
  <p>Digite a data do nosso namoro</p>

    id="password" 
    placeholder="DDMMAAAA"

    🔓 Acessar
  </button>

  <span id="error">Nosso amor está perdido 💔</span>
</section>

<script src="senha.js"></script>
</body>
</html>
